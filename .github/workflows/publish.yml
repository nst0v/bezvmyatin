name: Publish simplified site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4

      - name: Restore clean source tree
        run: |
          mkdir -p /tmp/bezvmyatin-source
          tar -xzf .release/site.tgz -C /tmp/bezvmyatin-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/bezvmyatin-source/. .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install TypeScript CLI
        run: npm install --global typescript@5.8.3

      - name: Validate and build
        run: |
          npm install
          npm run check

      - name: Publish production build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Replace bootstrap with project sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish simplified anti-vibecode site [skip ci]"
          git push origin HEAD:main
