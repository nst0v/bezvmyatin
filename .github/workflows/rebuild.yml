name: Rebuild anti-vibecode project

on:
  pull_request:
    branches: [main]
    paths:
      - '.rebuild-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace legacy project with the verified source tree
        run: node .bootstrap/rebuild.mjs
      - name: Validate rebuilt project
        run: |
          npm install
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Commit rebuilt project to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "redesign: rebuild PDR demo without AI landing patterns"
          git push origin HEAD:main
